<!--MindAR ターゲット認識後　iframeでwebページへ移行-->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindAR iframe表示</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    /* iframeの小窓 */
    #webWindow {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 15%;
      left: 5%;
      width: 90%;
      height: 65%;
      background: white;
      border: 3px solid #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    /* iframe */
    #webFrame {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* 閉じるボタン */
    #closeButton {
      position: absolute;
      top: 5px;
      right: 5px;
      z-index: 1001;
      background: red;
      color: white;
      border: none;
      border-radius: 50%;
      width: 35px;
      height: 35px;
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- MindAR -->
  <a-scene
    mindar-image="imageTargetSrc: ./etc/targets_2024ura.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- ターゲット画像 -->
    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0">
    </a-entity>

  </a-scene>

  <!-- Webページの小窓 -->
  <div id="webWindow">

    <button id="closeButton">×</button>

    <iframe
      id="webFrame"
      src="about:blank"
      allow="fullscreen">
    </iframe>

  </div>

  <script>

    const target = document.querySelector("#target");

    const webWindow = document.querySelector("#webWindow");
    const webFrame = document.querySelector("#webFrame");
    const closeButton = document.querySelector("#closeButton");

    // ターゲット画像を認識したとき
    target.addEventListener("targetFound", function() {

            // Webページを表示
      webFrame.src = "https://canva.link/z1ddxt4ihuwxykh";

      webWindow.style.display = "block";

      console.log("ターゲット認識");

    });

    // ターゲット画像を見失ったとき
    target.addEventListener("targetLost", function() {

      webWindow.style.display = "none";

      // iframeの読み込みを停止
      webFrame.src = "about:blank";

      console.log("ターゲットを見失いました");

    });

    // 閉じるボタン
    closeButton.addEventListener("click", function() {

      webWindow.style.display = "none";

      webFrame.src = "about:blank";

    });

  </script>

</body>
</html>

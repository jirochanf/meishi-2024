<!--MindAR ターゲット認識後　ボタン押下でwebページへ移行-->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MindAR ターゲット認識でWebページリンク</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    #linkButton {
      display: none;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;

      padding: 16px 30px;
      font-size: 18px;
      color: white;
      background: #007bff;
      border: none;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <button id="linkButton">自己紹介ページを開く</button>

  <a-scene
    mindar-image="imageTargetSrc: ./etc/targets_2024ura.mind;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0"
              look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0">
    </a-entity>

  </a-scene>

  <script>
    const target = document.querySelector("#target");
    const button = document.querySelector("#linkButton");

    // 認識したらボタン表示
    target.addEventListener("targetFound", function () {
      button.style.display = "block";
    });

    // ターゲットを見失ったらボタン非表示
    target.addEventListener("targetLost", function () {
      button.style.display = "none";
    });

    // ボタンを押したらWebページへ
    button.addEventListener("click", function () {
      window.location.href = "https://canva.link/z1ddxt4ihuwxykh";
    });
  </script>

</body>
</html>
